// ============ COUNTER HOOK ============
const useCountUp = (target, duration, decimals) => {
  const [count, setCount] = useState(0);
  const elRef = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    const el = elRef.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting && !started.current) {
          started.current = true;
          const t0 = performance.now();
          const tick = (now) => {
            const p = Math.min((now - t0) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            const cur = eased * target;
            setCount(decimals > 0 ? parseFloat(cur.toFixed(decimals)) : Math.floor(cur));
            if (p < 1) requestAnimationFrame(tick);
            else setCount(target);
          };
          requestAnimationFrame(tick);
        }
      },
      { threshold: 0.5 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, [target, duration, decimals]);

  return [count, elRef];
};

// ============ CURSOR PERSONALIZADO ============
/**
 * @module CursorPersonalizado
 * @description Cursor circular de doble capa con lag GSAP (Stripe/Linear pattern).
 *
 * Capas:
 *  - `.cursor-dot`  — punto de 6px, sigue el mouse al instante (gsap.set).
 *  - `.cursor-ring` — anillo de 38px, sigue con lag suave (power3.out, 0.55s).
 *
 * Estados del anillo:
 *  - "default" → anillo translúcido, sin fill.
 *  - "link"    → levemente relleno, escala ×1.7 (sobre a, button, [data-magnetic]).
 *  - "view"    → relleno navy, escala ×3.2, etiqueta "VIEW" (sobre [data-cursor="view"]).
 *  - "drag"    → relleno teal, escala ×2.2, etiqueta "DRAG" (sobre [data-cursor="drag"]).
 *
 * Solo se activa en dispositivos pointer:fine (mouse real); en touch no renderiza nada.
 */
const CursorPersonalizado = () => {
  const dotRef  = useRef(null);
  const ringRef = useRef(null);

  // Detección síncrona de pointer:fine — evita renderizar elementos en touch devices
  const esFinePointer = window.matchMedia("(pointer: fine)").matches;

  useEffect(() => {
    if (!esFinePointer) return;

    const dot  = dotRef.current;
    const ring = ringRef.current;
    if (!dot || !ring) return;

    // Centrar con xPercent/yPercent (una sola vez) para que x/y sean absolutos al cursor
    gsap.set([dot, ring], { xPercent: -50, yPercent: -50, x: -200, y: -200 });

    // Añadir clase al body para activar cursor:none en toda la página
    document.body.classList.add("cursor-custom-active");

    let primeraVez = true;

    // ── Seguimiento del mouse ──────────────────────────────────────────────────
    /**
     * @description Actualiza la posición del cursor. El dot sigue al instante;
     *              el ring sigue con lag suave vía power3.out.
     * @param {MouseEvent} e
     */
    const onMouseMove = (e) => {
      const { clientX: x, clientY: y } = e;

      // En el primer movimiento: revelar ambas capas
      if (primeraVez) {
        primeraVez = false;
        gsap.to([dot, ring], { opacity: 1, duration: 0.4, ease: "power2.out" });
      }

      gsap.set(dot,  { x, y });
      gsap.to(ring,  { x, y, duration: 0.55, ease: "power3.out", overwrite: true });
    };

    // ── Estados de hover (delegación en document) ──────────────────────────────
    /**
     * @description Determina el estado del cursor según el elemento bajo el puntero
     *              y aplica las animaciones de escala/apariencia correspondientes.
     * @param {string} estado - "default" | "link" | "view" | "drag"
     */
    const aplicarEstado = (estado) => {
      ring.dataset.cursorState = estado;

      if (estado === "view") {
        gsap.to(dot,  { scale: 0,   duration: 0.2, ease: "power2.out",     overwrite: true  });
        gsap.to(ring, { scale: 3.2, duration: 0.45, ease: "power2.out",    overwrite: "auto" });
      } else if (estado === "drag") {
        gsap.to(dot,  { scale: 0,   duration: 0.2, ease: "power2.out",     overwrite: true  });
        gsap.to(ring, { scale: 2.2, duration: 0.4, ease: "power2.out",     overwrite: "auto" });
      } else if (estado === "link") {
        gsap.to(dot,  { scale: 1,   duration: 0.25, ease: "power2.out",    overwrite: true  });
        gsap.to(ring, { scale: 1.7, duration: 0.35, ease: "power2.out",    overwrite: "auto" });
      } else {
        gsap.to(dot,  { scale: 1,   duration: 0.25, ease: "power2.out",    overwrite: true  });
        gsap.to(ring, { scale: 1,   duration: 0.35, ease: "power2.out",    overwrite: "auto" });
      }
    };

    const onMouseOver = (e) => {
      const t = e.target;
      if (t.closest("[data-cursor='view']"))         return aplicarEstado("view");
      if (t.closest("[data-cursor='drag']"))         return aplicarEstado("drag");
      if (t.closest("a, button, [data-magnetic]"))   return aplicarEstado("link");
      aplicarEstado("default");
    };

    // ── Pulso en click ─────────────────────────────────────────────────────────
    const onMouseDown = () => {
      const escalaActual = ring.dataset.cursorState === "view"  ? 2.8
                         : ring.dataset.cursorState === "drag"  ? 1.9
                         : ring.dataset.cursorState === "link"  ? 1.35
                         : 0.85;
      gsap.to(dot,  { scale: 0.45, duration: 0.1, overwrite: true   });
      gsap.to(ring, { scale: escalaActual, duration: 0.1, overwrite: "auto" });
    };

    const onMouseUp = () => {
      const escalaFinal = ring.dataset.cursorState === "view"  ? 3.2
                        : ring.dataset.cursorState === "drag"  ? 2.2
                        : ring.dataset.cursorState === "link"  ? 1.7
                        : 1;
      gsap.to(dot,  { scale: 1, duration: 0.25, ease: "back.out(2)",   overwrite: true   });
      gsap.to(ring, { scale: escalaFinal, duration: 0.35, ease: "back.out(1.5)", overwrite: "auto" });
    };

    // ── Visibilidad al salir/entrar del viewport ───────────────────────────────
    const onMouseLeave = () => gsap.to([dot, ring], { opacity: 0, duration: 0.3, overwrite: true });
    const onMouseEnter = () => gsap.to([dot, ring], { opacity: 1, duration: 0.3, overwrite: true });

    document.addEventListener("mousemove",  onMouseMove, { passive: true });
    document.addEventListener("mouseover",  onMouseOver);
    document.addEventListener("mousedown",  onMouseDown);
    document.addEventListener("mouseup",    onMouseUp);
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.documentElement.addEventListener("mouseenter", onMouseEnter);

    return () => {
      document.body.classList.remove("cursor-custom-active");
      document.removeEventListener("mousemove",  onMouseMove);
      document.removeEventListener("mouseover",  onMouseOver);
      document.removeEventListener("mousedown",  onMouseDown);
      document.removeEventListener("mouseup",    onMouseUp);
      document.documentElement.removeEventListener("mouseleave", onMouseLeave);
      document.documentElement.removeEventListener("mouseenter", onMouseEnter);
    };
  }, []);

  // En touch: no renderizar nada — mantener el cursor nativo del sistema
  if (!esFinePointer) return null;

  return (
    <>
      <div ref={dotRef} className="cursor-dot" aria-hidden="true" />
      <div ref={ringRef} className="cursor-ring" data-cursor-state="default" aria-hidden="true">
        <span className="cursor-label">VIEW</span>
        <span className="cursor-label-drag">DRAG</span>
      </div>
    </>
  );
};

/**
 * @module NavbarAnimaciones
 * @description Módulo que gestiona el comportamiento inteligente de la navbar con GSAP.
 *
 * Comportamiento:
 * - Oculta la navbar con `yPercent: -100` al scrollear hacia abajo (Stripe / Linear / Vercel pattern).
 * - La muestra de nuevo con `yPercent: 0` al scrollear hacia arriba.
 * - No se oculta mientras el menú móvil esté abierto.
 * - No se oculta si el usuario está dentro de los primeros 80 px de la página.
 * - Aplica el efecto vidrio (glass) a través de ScrollTrigger para evitar conflictos con React state.
 */
const NavbarAnimaciones = {
  /**
   * @description Inicializa Observer (hide/show) + ScrollTrigger (glass effect) para la navbar.
   * @param {HTMLElement} headerEl - Elemento <header> de la navbar.
   * @param {React.MutableRefObject<boolean>} menuOpenRef - Ref que indica si el menú móvil está abierto.
   * @returns {Function} Función de cleanup que destruye Observer y ScrollTrigger asociados.
   */
  inicializar(headerEl, menuOpenRef) {
    if (!headerEl) return () => {};

    const cleanups = [];
    const UMBRAL_TOP_PX = 80; // px desde el top antes de activar el hide

    // ── Glass background (ScrollTrigger) ──────────────────────────────────────
    // Se aplica/quita un data-attribute; la transición visual la maneja CSS (sin conflicto con GSAP transform).
    const glassTrigger = ScrollTrigger.create({
      start: `top+=${UMBRAL_TOP_PX} top`,
      onEnter:     () => headerEl.setAttribute("data-scrolled", "true"),
      onLeaveBack: () => headerEl.removeAttribute("data-scrolled"),
    });
    cleanups.push(() => glassTrigger.kill());

    // ── Hide / Show con Observer ──────────────────────────────────────────────
    if (Observer) {
      gsap.registerPlugin(Observer);

      let oculta = false;

      /** @description Oculta la navbar deslizándola hacia arriba. */
      const ocultar = () => {
        if (oculta) return;
        oculta = true;
        gsap.to(headerEl, { yPercent: -100, duration: 0.38, ease: "power2.inOut", overwrite: true });
      };

      /** @description Muestra la navbar deslizándola hacia abajo hasta su posición original. */
      const mostrar = () => {
        if (!oculta) return;
        oculta = false;
        gsap.to(headerEl, { yPercent: 0, duration: 0.35, ease: "power2.out", overwrite: true });
      };

      const obs = Observer.create({
        type: "scroll,wheel,touch",
        tolerance: 8,
        onDown: () => {
          // No ocultar si: menú abierto, o estamos cerca del top de la página
          if (menuOpenRef.current || window.scrollY < UMBRAL_TOP_PX) return;
          ocultar();
        },
        onUp: () => mostrar(),
      });

      cleanups.push(() => obs.kill());
    }

    return () => cleanups.forEach(fn => fn());
  },
};

const Navbar = () => {
  const [menuOpen, setMenuOpen] = useState(false);
  const headerRef  = useRef(null);
  const menuOpenRef = useRef(false);

  // Mantiene menuOpenRef sincronizado con el estado React (evita closures obsoletos en Observer)
  useEffect(() => { menuOpenRef.current = menuOpen; }, [menuOpen]);

  // Si el menú se abre mientras la navbar estaba oculta → forzar que vuelva a aparecer
  useEffect(() => {
    if (menuOpen && headerRef.current) {
      gsap.to(headerRef.current, { yPercent: 0, duration: 0.3, ease: "power2.out", overwrite: true });
    }
    document.body.style.overflow = menuOpen ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [menuOpen]);

  // Teclado: Escape cierra el menú móvil

    if (!menuOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setMenuOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [menuOpen]);

  // Inicializar NavbarAnimaciones (Observer + ScrollTrigger glass)

    const cleanup = NavbarAnimaciones.inicializar(headerRef.current, menuOpenRef);

  /**
   * @description Registra todos los plugins GSAP necesarios para las animaciones del hero.
   * Crea el CustomEase de firma de la marca si el plugin está disponible.
   */
  registrarPlugins() {
    gsap.registerPlugin(ScrollTrigger);
    if (SplitText)         gsap.registerPlugin(SplitText);
    if (CustomEase)        gsap.registerPlugin(CustomEase);
    if (ScrambleTextPlugin) gsap.registerPlugin(ScrambleTextPlugin);
    if (CustomEase && !CustomEase.get("mb.out")) {
      CustomEase.create("mb.out", "0.16, 1, 0.3, 1");
    }
  },

  /**
   * @description Aplica el estado inicial invisible a todos los elementos animables
   * del hero. El titular queda oculto solo si SplitText no está disponible.
   * @param {HeroRefs} refs - Mapa de referencias a los elementos del hero.
   */
  establecerEstadoInicial(refs) {
    gsap.set(refs.bgWrapper, { scale: 1.18 });
    gsap.set([refs.eyebrow, refs.subhead, refs.ctaGroup, refs.trustRow], { autoAlpha: 0, y: 40 });
    if (!SplitText) gsap.set(refs.headline, { autoAlpha: 0, y: 40 });
    if (refs.aside) gsap.set(refs.aside, { autoAlpha: 0, x: 48 });
  },

  /**
   * @description Construye la animación cinética del titular principal: cada carácter
   * parte desde una posición y rotación aleatoria en el espacio y converge en su lugar.
   * Degradación elegante a fade-up si SplitText no cargó.
   * @param {HTMLElement} headline - Elemento H1 del titular.
   * @returns {gsap.core.Tween|gsap.core.Timeline} Animación resultante.
   */
  crearKineticTitular(headline) {
    const ease = CustomEase ? "mb.out" : "power4.out";

    if (!SplitText) {
      return gsap.from(headline, { autoAlpha: 0, y: 40, duration: 1.0, ease });
    }

    const split = SplitText.create(headline, { type: "chars,words", smartWrap: true });

    gsap.set(split.chars, {
      x:        () => gsap.utils.random(-700, 700),
      y:        () => gsap.utils.random(-450, 450),
      rotation: () => gsap.utils.random(-180, 180),
      scale:    () => gsap.utils.random(0.1, 2.4),
      opacity: 0,
    });

    return gsap.to(split.chars, {
      x: 0, y: 0, rotation: 0, scale: 1, opacity: 1,
      duration: 1.5,
      ease,
      stagger: { amount: 1.1, from: "random" },
    });
  },

  /**
   * @description Construye y reproduce la timeline de animación de entrada del hero.
   * El titular usa animación cinética de caracteres; el resto usa fade-up escalonado.
   * @param {HeroRefs} refs - Mapa de referencias a los elementos del hero.
   * @returns {gsap.core.Timeline} La timeline de entrada resultante.
   */
  crearTimelineEntrada(refs) {
    const ease = CustomEase ? "mb.out" : "power3.out";
    const tl = gsap.timeline({ defaults: { ease } });

    tl.to(refs.bgWrapper, { scale: 1.12, duration: 2.4, ease: "power2.out" }, 0)
      .to(refs.eyebrow,   { autoAlpha: 1, y: 0, duration: 0.7 }, 0.15)
      .add(HeroAnimaciones.crearKineticTitular(refs.headline),   0.3)
      .to(refs.subhead,   { autoAlpha: 1, y: 0, duration: 0.85 }, 0.75)
      .to(refs.ctaGroup,  { autoAlpha: 1, y: 0, duration: 0.8 },  0.92)
      .to(refs.trustRow,  { autoAlpha: 1, y: 0, duration: 0.7 },  1.06);

    if (refs.aside) {
      tl.to(refs.aside, { autoAlpha: 1, x: 0, duration: 1.1, ease: "power2.out" }, 0.45);

      if (refs.asideNumber && ScrambleTextPlugin) {
        tl.to(refs.asideNumber, {
          duration: 1.1,
          scrambleText: { text: "4", chars: "0123456789", revealDelay: 0.35, speed: 0.6 },
        }, 1.05);
      }
    }

    return tl;
  },

  /**
   * @description Configura el efecto parallax de la imagen de fondo vinculado al scroll.
   * @param {HTMLElement} bgWrapper - Contenedor de la imagen de fondo.
   * @param {HTMLElement} seccion   - Elemento raíz de la sección hero.
   */
  configurarParallaxFondo(bgWrapper, seccion) {
    gsap.to(bgWrapper, {
      yPercent: 22,
      ease: "none",
      scrollTrigger: { trigger: seccion, start: "top top", end: "bottom top", scrub: true },
    });
  },

  /**
   * @description Configura el desvanecimiento de la columna de texto al scrollear.
   * @param {HTMLElement} textoColumna - Contenedor con el copy y CTAs del hero.
   * @param {HTMLElement} seccion      - Elemento raíz de la sección hero.
   */
  configurarScrollTexto(textoColumna, seccion) {
    gsap.to(textoColumna, {
      y: -65, autoAlpha: 0, ease: "none",
      scrollTrigger: { trigger: seccion, start: "18% top", end: "58% top", scrub: 1.2 },
    });
  },

  /**
   * @description Configura la reducción de escala del fondo al salir del viewport.
   * @param {HTMLElement} bgWrapper - Contenedor de la imagen de fondo.
   * @param {HTMLElement} seccion   - Elemento raíz de la sección hero.
   */
  configurarZoomSalida(bgWrapper, seccion) {
    gsap.to(bgWrapper, {
      scale: 1.0, ease: "none",
      scrollTrigger: { trigger: seccion, start: "35% top", end: "bottom top", scrub: 1 },
    });
  },

  /**
   * @description Punto de entrada del módulo. Inicializa todas las animaciones del hero
   * respetando prefers-reduced-motion. Con movimiento reducido, los elementos se revelan
   * instantáneamente sin transiciones.
   * @param {HeroRefs} refs - Mapa completo de referencias del hero.
   * @returns {gsap.MatchMedia} Instancia de matchMedia para revertir en desmontaje.
   */
  inicializar(refs) {
    HeroAnimaciones.registrarPlugins();
    const mm = gsap.matchMedia();

    mm.add(
      {
        sinMovimiento: "(prefers-reduced-motion: reduce)",
        conMovimiento: "(prefers-reduced-motion: no-preference)",
      },
      (ctx) => {
        if (ctx.conditions.sinMovimiento) {
          gsap.set([refs.eyebrow, refs.headline, refs.subhead, refs.ctaGroup, refs.trustRow], { autoAlpha: 1, y: 0 });
          if (refs.aside) gsap.set(refs.aside, { autoAlpha: 1, x: 0 });
          gsap.set(refs.bgWrapper, { scale: 1.12 });
          return;
        }
        HeroAnimaciones.establecerEstadoInicial(refs);
        HeroAnimaciones.crearTimelineEntrada(refs);
        HeroAnimaciones.configurarParallaxFondo(refs.bgWrapper, refs.seccion);
        HeroAnimaciones.configurarScrollTexto(refs.textoColumna, refs.seccion);
        HeroAnimaciones.configurarZoomSalida(refs.bgWrapper, refs.seccion);
      }
    );

    return mm;
  },
};

// ============ MÓDULO DE ANIMACIONES DE SECCIONES ============

const SeccionesAnimaciones = {

  /**
   * @description Registra plugins adicionales y crea el CustomEase de marca si está disponible.
   */
  registrarPlugins() {
    if (SplitText)  gsap.registerPlugin(SplitText);
    if (CustomEase) {
      gsap.registerPlugin(CustomEase);
      if (!CustomEase.get("mb.out")) CustomEase.create("mb.out", "0.16, 1, 0.3, 1");
    }
  },

  /**
   * @description Anima cada titular de sección con SplitText y máscara de líneas.
   * Las líneas suben desde detrás de un clip invisible al entrar en el viewport.
   */
  animarTitulares() {
    if (!SplitText) return;
    const ease = CustomEase ? "mb.out" : "power3.out";

    document.querySelectorAll("[data-gsap-headline]").forEach(el => {
      const split = SplitText.create(el, { type: "lines", mask: "lines" });
      ScrollTrigger.create({
        trigger: el,
        start: "top 88%",
        once: true,
        onEnter: () => gsap.from(split.lines, {
          yPercent: 110,
          duration: 0.95,
          ease,
          stagger: 0.08,
        }),
      });
    });
  },

  /**
   * @description Crea entradas 3D escalonadas para todas las tarjetas del sitio.
   * Agrupa los elementos que entran en el viewport en el mismo frame con ScrollTrigger.batch.
   */
  animarTarjetas() {
    const ease = CustomEase ? "mb.out" : "power3.out";

    ScrollTrigger.batch("[data-gsap-card]", {
      onEnter: (batch) => gsap.from(batch, {
        opacity: 0,
        y: 72,
        rotationX: 14,
        scale: 0.95,
        transformPerspective: 900,
        transformOrigin: "top center",
        duration: 0.9,
        ease,
        stagger: 0.09,
        overwrite: true,
      }),
      start: "top 92%",
      once: true,
    });
  },

  /**
   * @description Aplica efecto magnético a todos los botones CTA con data-magnetic.
   * El botón sigue el cursor con suavizado y regresa con resorte elástico al salir.
   */
  activarMagneticCTAs() {
    document.querySelectorAll("[data-magnetic]").forEach(btn => {
      const onMove = (e) => {
        const r = btn.getBoundingClientRect();
        gsap.to(btn, {
          x: (e.clientX - (r.left + r.width  / 2)) * 0.3,
          y: (e.clientY - (r.top  + r.height / 2)) * 0.3,
          duration: 0.4,
          ease: "power2.out",
          overwrite: "auto",
        });
      };
      const onLeave = () => {
        gsap.to(btn, {
          x: 0, y: 0,
          duration: 0.7,
          ease: "elastic.out(1, 0.45)",
        });
      };
      btn.addEventListener("mousemove", onMove);
      btn.addEventListener("mouseleave", onLeave);
    });
  },

  /**
   * @description Punto de entrada del módulo. Inicializa todas las animaciones de secciones
   * respetando prefers-reduced-motion del sistema operativo.
   * @returns {gsap.MatchMedia} Instancia para revertir en desmontaje del componente raíz.
   */
  inicializar() {
    SeccionesAnimaciones.registrarPlugins();
    const mm = gsap.matchMedia();
    mm.add("(prefers-reduced-motion: no-preference)", () => {
      SeccionesAnimaciones.animarTitulares();
      SeccionesAnimaciones.animarTarjetas();
      SeccionesAnimaciones.activarMagneticCTAs();
    });
    return mm;
  },
};

// ============ BEFORE / AFTER SLIDER ============
const BeforeAfterSlider = ({ before, after }) => {
  const containerRef = useRef(null);
  const [position, setPosition] = useState(50);
  const dragging = useRef(false);

  const updatePosition = useCallback((clientX) => {
    const el = containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    setPosition(pct);
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      updatePosition(x);
    };
    const onUp = () => { dragging.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
    };
  }, [updatePosition]);

  const startDrag = (e) => {
    dragging.current = true;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    updatePosition(x);
  };

  return (
    <div
      ref={containerRef}
      onMouseDown={startDrag}
      onTouchStart={startDrag}
      className="ba-slider relative w-full aspect-[4/3] md:aspect-[16/10] rounded-3xl overflow-hidden cursor-ew-resize select-none"
      data-cursor="drag"
      style={{ border: "1px solid var(--border-med)", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" }}
    >
      <img src={after} alt="After" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      <div className="absolute inset-0 overflow-hidden" style={{ clipPath: `inset(0 ${100 - position}% 0 0)` }}>
        <img src={before} alt="Before" loading="lazy" decoding="async" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      </div>

      <div className="absolute top-4 left-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "rgba(13,79,114,0.75)", border: "1px solid rgba(255,255,255,0.15)", backdropFilter: "blur(8px)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-red-400" />Before
        </span>
      </div>
      <div className="absolute top-4 right-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "var(--orange)", boxShadow: "0 4px 12px rgba(255,107,31,0.4)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-white" />After
        </span>
      </div>

      <div className="absolute top-0 bottom-0 z-10 pointer-events-none" style={{ left: `${position}%`, transform: "translateX(-50%)" }}>
        <div className="w-0.5 h-full" style={{ background: "var(--orange)", boxShadow: "0 0 20px rgba(255,107,31,0.7)" }} />
        <div
          className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full flex items-center justify-center pointer-events-auto cursor-ew-resize shadow-2xl"
          style={{ background: "rgba(13,79,114,0.85)", border: "2px solid var(--orange)", backdropFilter: "blur(8px)" }}
        >
          <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 3 12 9 6" />
            <polyline points="15 6 21 12 15 18" />
          </svg>
        </div>
      </div>

      <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
        <span className="text-[11px] font-bold uppercase tracking-[0.15em] text-white bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full">
          Drag to compare
        </span>
      </div>
    </div>
  );
};

// ============ STATS ============
const StatCounter = ({ value, suffix, decimals, label, sub, index }) => {
  const [count, setCount] = useState(0);
  const elRef = useRef(null);

  useEffect(() => {
    if (!elRef.current) return;
    const proxy = { val: 0 };
    let tween = null;
    const st = ScrollTrigger.create({
      trigger: elRef.current,
      start: "top 82%",
      onEnter: () => {
        tween = gsap.to(proxy, {
          val: value,
          duration: 1.8 + index * 0.14,
          ease: "power2.out",
          onUpdate: () => setCount(
            decimals > 0 ? parseFloat(proxy.val.toFixed(decimals)) : Math.floor(proxy.val)
          ),
          onComplete: () => setCount(value),
        });
      },
      onLeaveBack: () => {
        if (tween) tween.kill();
        proxy.val = 0;
        setCount(0);
      },
    });
    return () => { st.kill(); if (tween) tween.kill(); };
  }, [value, index, decimals]);

  const display = decimals > 0 ? count.toFixed(decimals) : count;

  return (
    <div ref={elRef} className="text-center md:text-left" data-gsap-card>
      <div className="font-display italic text-5xl md:text-6xl lg:text-7xl leading-none mb-2" style={{ color: "var(--sun)" }}>
        {display}{suffix}
      </div>
      <div className="text-sm md:text-base font-bold uppercase tracking-[0.12em] text-white mb-1">{label}</div>
      <div className="text-[12px] md:text-[13px]" style={{ color: "var(--text-muted)" }}>{sub}</div>
    </div>
  );
};
