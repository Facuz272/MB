  <!-- Babel standalone for JSX in browser -->

  <!-- ESM import map: lets us use bare specifiers like 'react' and 'framer-motion' -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",

    }
  }

  <style>
    html, body { background: #0a0a0a; margin: 0; padding: 0; }
    #loading-fallback {
      position: fixed; inset: 0; background: #0a0a0a; color: #888;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; font-size: 11px;
      letter-spacing: 0.3em; text-transform: uppercase; z-index: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="loading-fallback">Compiling…</div>

  <!-- Bootstrap: import ESM modules then compile + mount JSX -->
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import * as FramerMotion from 'framer-motion';

    // Expose globals so compiled JSX can find them
    window.React = React;
    window.FramerMotion = FramerMotion;

    // Get JSX source
    const jsxSource = document.getElementById('app-source').textContent;

    // Preamble destructures globals into local scope for the compiled code
    const preamble = `
      const { useState, useEffect, useRef, useCallback } = React;
      const { motion, AnimatePresence, useScroll, useTransform } = FramerMotion;
    `;

    try {
      const compiled = Babel.transform(preamble + jsxSource, {
        presets: ['react'],
      }).code;

      // Execute in function scope; return App
      const fn = new Function('React', `${compiled}\nreturn App;`);
      const App = fn(React);

      const fallback = document.getElementById('loading-fallback');
      if (fallback) fallback.remove();

      createRoot(document.getElementById('root')).render(React.createElement(App));
    } catch (err) {
      console.error('Compile/render error:', err);
      const fallback = document.getElementById('loading-fallback');
      if (fallback) fallback.textContent = 'Error — open browser console';
    }
  </script>

  <script type="text/plain" id="app-source">

// ============ BEFORE / AFTER SLIDER ============
const BeforeAfterSlider = ({ before, after }) => {
  const containerRef = useRef(null);
  const [position, setPosition] = useState(50);
  const dragging = useRef(false);

  const updatePosition = useCallback((clientX) => {
    const el = containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    setPosition(pct);
  }, []);

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      updatePosition(x);
    };
    const onUp = () => { dragging.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
    };
  }, [updatePosition]);

  const startDrag = (e) => {
    dragging.current = true;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    updatePosition(x);
  };

  return (
    <div
      ref={containerRef}
      onMouseDown={startDrag}
      onTouchStart={startDrag}
      className="ba-slider relative w-full aspect-[4/3] md:aspect-[16/10] rounded-3xl overflow-hidden bg-white border-2 cursor-ew-resize select-none shadow-xl"
      style={{ borderColor: "#E5EAF0" }}
    >
      <img src={after} alt="After" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      <div className="absolute inset-0 overflow-hidden" style={{ clipPath: `inset(0 ${100 - position}% 0 0)` }}>
        <img src={before} alt="Before" className="absolute inset-0 w-full h-full object-cover" draggable={false} />
      </div>

      <div className="absolute top-4 left-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "var(--brand)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-red-400" />
          Before
        </span>
      </div>
      <div className="absolute top-4 right-4 z-20">
        <span className="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-[0.15em] text-white px-3 py-1.5 rounded-full shadow-lg" style={{ background: "var(--orange)" }}>
          <span className="w-1.5 h-1.5 rounded-full bg-white" />
          After
        </span>
      </div>

      <div className="absolute top-0 bottom-0 z-10 pointer-events-none" style={{ left: `${position}%`, transform: "translateX(-50%)" }}>
        <div className="w-1 h-full" style={{ background: "var(--orange)", boxShadow: "0 0 20px rgba(255,107,31,0.6)" }} />
        <div
          className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-white flex items-center justify-center pointer-events-auto cursor-ew-resize shadow-xl"
          style={{ border: "3px solid var(--orange)" }}
        >
          <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="9 18 3 12 9 6" />
            <polyline points="15 6 21 12 15 18" />
          </svg>
        </div>
      </div>

      <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none">
        <span className="text-[11px] font-bold uppercase tracking-[0.15em] text-white bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full">
          Drag to compare
        </span>
      </div>
    </div>
  );
};
